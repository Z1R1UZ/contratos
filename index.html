<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructivo Facturación</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            display: grid;
            place-items: center;
            background: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }
        a.descargar {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 20px 38px;
            border-radius: 60px;
            color: #fff;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(305deg, #67a4f5 0%, #005edb 80%);
            box-shadow: 0 10px 28px rgba(0, 94, 219, .35);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        a.descargar:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 94, 219, .45); }
        a.descargar:active { transform: translateY(0); }
        a.descargar:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
        a.descargar svg { width: 26px; height: 26px; flex: none; }
    </style>
</head>
<body>
    <!-- La descarga pasa por /descargar del maestro (siempre entrega la última versión del instalador) -->
    <a class="descargar" href="http://192.168.0.25:3200/descargar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
        Descargar Instructivo
    </a>
</body>
</html>
