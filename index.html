    function addProcedure(proc, contractCode) {
        const key = proc.codigo;
        if (!proceduresMap[key]) {
            let classification = proc.clasif || 'Desconocido';
            let service = SERVICE_MAP[classification] || `Servicio ${classification}`;
            if (!proc.clasif) {
                if (key.startsWith('890')) classification = '304';
                else if (key.startsWith('129')||key.startsWith('130')||key.startsWith('110')) classification = '129';
                else if (key.startsWith('901')||key.startsWith('902')||key.startsWith('903')||key.startsWith('907')) classification = '706';
                else if (key.startsWith('870')||key.startsWith('871')||key.startsWith('872')||key.startsWith('873')||key.startsWith('876')||key.startsWith('879')) classification = '744';
                else if (key.startsWith('881')||key.startsWith('882')) classification = '745';
                else classification = '203';
                service = SERVICE_MAP[classification] || `Servicio ${classification}`;
            }
            proceduresMap[key] = {
                code: key,
                description: proc.desc || proc.descripcion || 'Sin descripción',
                classification: classification,
                service: service,
                isPackage: proc.isPackage || false,
                exclusiones: proc.exclusiones || '',
                packageItems: proc.packageItems || [],
                contractValues: {},
                contracts: []
            };
        }
        const p = proceduresMap[key];
        const val = parseValue(proc.valor);
        if (val > 0) p.contractValues[contractCode] = val;
        if (!p.contracts.includes(contractCode)) p.contracts.push(contractCode);
        if (proc.packageItems && proc.packageItems.length > 0) {
            p.isPackage = true;
            p.packageItems = proc.packageItems;
        }
        if (proc.exclusiones) {
            p.exclusiones = proc.exclusiones;
        }
    }

    function formatCurrency(val) {
        if (val === undefined || val === null) return 'N/D';
        return '$ ' + Math.round(val).toLocaleString('es-CO');
    }

    function getContractByCode(code) {
        return CONTRACTS.find(c => c.code === code);
    }

    function renderProcedureBlock(proc) {
        const block = document.createElement('div');
        block.className = 'proc-block';

        // Header
        const header = document.createElement('div');
        header.className = 'proc-header';
        const codeDiv = document.createElement('div');
        codeDiv.className = 'proc-code';
        codeDiv.innerHTML = `${proc.code} <small>${proc.service}</small>`;
        const tags = document.createElement('div');
        tags.className = 'proc-tags';
        if (proc.isPackage) {
            const tag = document.createElement('span');
            tag.className = 'tag tag-package';
            tag.innerHTML = '<i class="fas fa-box"></i> Paquete';
            tags.appendChild(tag);
        } else {
            const tag = document.createElement('span');
            tag.className = 'tag tag-simple';
            tag.innerHTML = '<i class="fas fa-syringe"></i> Simple';
            tags.appendChild(tag);
        }
        const clsTag = document.createElement('span');
        clsTag.className = 'tag tag-service';
        clsTag.textContent = `Clasif: ${proc.classification}`;
        tags.appendChild(clsTag);
        header.appendChild(codeDiv);
        header.appendChild(tags);

        // Descripción
        const desc = document.createElement('div');
        desc.className = 'proc-desc';
        desc.textContent = proc.description;

        block.appendChild(header);
        block.appendChild(desc);

        // Contratos (horizontal)
        const contractsRow = document.createElement('div');
        contractsRow.className = 'contracts-row';

        const sortedContracts = proc.contracts.slice().sort();
        sortedContracts.forEach(cCode => {
            const contract = getContractByCode(cCode);
            if (!contract) return;
            const value = proc.contractValues[cCode] || 0;
            const card = document.createElement('div');
            card.className = 'contract-card';
            card.innerHTML = `
                <div class="contract-name">${contract.code} - ${contract.name}</div>
                <div class="contract-pop"><i class="fas fa-users"></i> ${contract.populations.join(', ')}</div>
                <div class="contract-date"><i class="fas fa-calendar-alt"></i> ${contract.implementationDate}</div>
                <div class="contract-value">${formatCurrency(value)}</div>
                <div class="contract-obs-short"><i class="fas fa-info-circle"></i> ${contract.exclusions}</div>
            `;
            contractsRow.appendChild(card);
        });

        block.appendChild(contractsRow);

        // Paquete
        if (proc.isPackage && proc.packageItems.length > 0) {
            const pkgSection = document.createElement('div');
            pkgSection.className = 'package-section';
            const pkgTitle = document.createElement('div');
            pkgTitle.className = 'package-title';
            pkgTitle.innerHTML = `<i class="fas fa-list-ul"></i> Ítems del paquete (${proc.packageItems.length})`;
            pkgSection.appendChild(pkgTitle);

            const wrap = document.createElement('div');
            wrap.className = 'package-table-wrap';
            const table = document.createElement('table');
            table.className = 'package-table';
            table.innerHTML = `
                <thead><tr><th>Código</th><th>Descripción</th><th>Observación</th></tr></thead>
                <tbody></tbody>
            `;
            const tbody = table.querySelector('tbody');
            proc.packageItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pkg-code">${item.code}</td>
                    <td>${item.desc}</td>
                    <td class="pkg-obs">${item.obs || ''}</td>
                `;
                tbody.appendChild(tr);
            });
            wrap.appendChild(table);
            pkgSection.appendChild(wrap);

            // Exclusiones del paquete (si existen)
            if (proc.exclusiones) {
                const exclDiv = document.createElement('div');
                exclDiv.className = 'pkg-exclusions';
                exclDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <span> ${proc.exclusiones}</span>`;
                pkgSection.appendChild(exclDiv);
            }

            block.appendChild(pkgSection);
        }

        return block;
    }

    function performSearch() {
        const query = searchInput.value.trim();
        resultsGrid.innerHTML = '';
        emptyState.style.display = 'none';
        resultCount.style.display = 'none';

        if (!query) {
            emptyState.style.display = 'block';
            return;
        }

        const q = query.toUpperCase();
        const found = [];
        for (const [code, proc] of Object.entries(proceduresMap)) {
            if (code.toUpperCase().includes(q) ||
                proc.description.toUpperCase().includes(q) ||
                proc.service.toUpperCase().includes(q)) {
                found.push(proc);
            }
        }

        if (found.length === 0) {
            emptyState.style.display = 'block';
            emptyState.querySelector('h3').textContent = 'No se encontraron resultados';
            emptyState.querySelector('p').textContent = `No hay procedimientos que coincidan con "${query}".`;
            return;
        }

        resultCount.style.display = 'flex';
        resultCountNum.textContent = found.length;

        found.sort((a, b) => a.code.localeCompare(b.code));

        found.forEach(proc => {
            const block = renderProcedureBlock(proc);
            resultsGrid.appendChild(block);
        });

        const first = resultsGrid.querySelector('.proc-block');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(); });

    // Cargar ejemplo
    const urlParams = new URLSearchParams(window.location.search);
    const queryParam = urlParams.get('q');
    if (queryParam) {
        searchInput.value = queryParam;
        performSearch();
    } else {
        searchInput.value = '530402';
        performSearch();
    }
